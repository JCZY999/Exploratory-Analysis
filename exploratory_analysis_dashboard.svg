<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><rect width="1400" height="780" fill="#07130f"/><g font-family="Arial"><text x="65" y="70" fill="#f0fff7" font-size="32" font-weight="700">Customer Churn Exploratory Analysis</text><text x="65" y="104" fill="#64f59e" font-size="16">SYNTHETIC PORTFOLIO EXAMPLE · COHORT, FUNNEL &amp; RISK SIGNALS</text><g fill="#0d241b" stroke="#24523e"><rect x="65" y="140" width="290" height="100" rx="12"/><rect x="380" y="140" width="290" height="100" rx="12"/><rect x="695" y="140" width="290" height="100" rx="12"/><rect x="1010" y="140" width="325" height="100" rx="12"/></g><g fill="#a9c4b4" font-size="16"><text x="88" y="174">Customers</text><text x="403" y="174">Observed churn</text><text x="718" y="174">Revenue at risk</text><text x="1033" y="174">Highest-risk segment</text></g><g fill="#f0fff7" font-size="29" font-weight="700"><text x="88" y="216">12,480</text><text x="403" y="216">18.6%</text><text x="718" y="216">$2.4M</text></g><text x="1033" y="214" fill="#64f59e" font-size="20" font-weight="700">Low usage + 3 tickets</text><text x="65" y="295" fill="#f0fff7" font-size="22" font-weight="700">Churn rate by tenure cohort</text><g fill="#64f59e"><rect x="110" y="485" width="90" height="140" rx="5"/><rect x="240" y="520" width="90" height="105" rx="5"/><rect x="370" y="548" width="90" height="77" rx="5"/><rect x="500" y="572" width="90" height="53" rx="5"/><rect x="630" y="590" width="90" height="35" rx="5"/></g><g fill="#c7dbcf" font-size="15"><text x="121" y="650">0–3 mo</text><text x="247" y="650">4–6 mo</text><text x="374" y="650">7–12 mo</text><text x="496" y="650">13–24 mo</text><text x="635" y="650">25+ mo</text></g><g fill="#a9c4b4" font-size="15"><text x="135" y="475">31%</text><text x="265" y="510">24%</text><text x="395" y="538">18%</text><text x="525" y="562">13%</text><text x="655" y="580">9%</text></g><rect x="790" y="280" width="545" height="375" rx="12" fill="#0d241b" stroke="#24523e"/><text x="820" y="325" fill="#f0fff7" font-size="21" font-weight="700">EDA findings → testable hypotheses</text><text x="820" y="370" fill="#c7dbcf" font-size="17">1. Early-tenure churn is 3.4× mature cohorts</text><text x="820" y="410" fill="#c7dbcf" font-size="17">2. Support friction compounds low product usage</text><text x="820" y="450" fill="#c7dbcf" font-size="17">3. Low NPS alone is less predictive than behavior</text><text x="820" y="490" fill="#c7dbcf" font-size="17">4. Retention outreach should prioritize value at risk</text><rect x="820" y="530" width="465" height="82" rx="8" fill="#163c2c"/><text x="845" y="562" fill="#64f59e" font-size="16" font-weight="700">PROPOSED TEST</text><text x="845" y="590" fill="#d7eadf" font-size="16">Onboarding + proactive support for 0–6 month cohort</text><text x="65" y="705" fill="#8fb4a0" font-size="15">Exploratory Analysis · Synthetic metrics · Jacob Chen portfolio</text></g></svg>
